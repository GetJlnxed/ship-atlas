name: Publish ATLAS to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Restore uploaded project files
        if: hashFiles('atlas-source.zip') != ''
        shell: bash
        run: |
          set -euo pipefail
          cat <<'HASHES' | sha256sum --check
          f50df9d0ddc4955ec5438ab2cf979e40a1109a5d857c674d76e1259cd2e7fb08  atlas-source.zip
          b406551de16f6ded6b4f72143965c3ffb8f75237cbb1dc590814e66485a6f7bd  atlas-images-0.zip
          1907d9db37f2c896b1ea53e4f4f747e90689311111f4244b0b4001b4d60b80b6  atlas-images-1.zip
          9a47bd91df1b412e878f78de07d263fc02b5346e7fc64c67f3048af563fb5618  atlas-images-2.zip
          HASHES
          unzip -o atlas-source.zip
          unzip -o atlas-images-0.zip
          unzip -o atlas-images-1.zip
          unzip -o atlas-images-2.zip
          git rm atlas-source.zip atlas-images-0.zip atlas-images-1.zip atlas-images-2.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore ATLAS source, catalogue and images'
          git push origin HEAD:main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment

